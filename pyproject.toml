[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
name = "modm-data-tools"
authors = [
    {name = "Niklas Hauser", email = "niklas@salkinium.com"},
]
description = "Lookups, clock solver and web pages on top of the modm-data hardware descriptions"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["embedded", "hardware", "stm32", "mcp", "clock"]
license = "MPL-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    # modm-data reads the data in its own ext/ folder: install a checkout of it with `pip install -e`
    "modm-data",
    "jinja2>=3.1.3,<4",
    "lbuild>=1.21",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    # tested with 0.5, whose default dpi=0 rejects SVGs sized in pt, the figures pass dpi=72
    "resvg-py>=0.5,<0.6",
    # regexes from tool input with a timeout
    "regex>=2024.4.16",
    # the OCR of bitmap figures
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://data.modm.dev"
"GitHub" = "https://github.com/modm-ext/modm-data-tools"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]
test = ["pytest>=9,<10"]
all = ["modm_data_tools[mcp,test]"]

[project.scripts]
modm-data-lookup = "modm_data_tools.lookup.__main__:main"
modm-data-mcp = "modm_data_tools.lookup.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
exclude = [".venv/", "build/"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# short names and lambdas are used deliberately in the parsers
ignore = ["E731", "E741"]
